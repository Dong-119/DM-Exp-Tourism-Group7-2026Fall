<svg xmlns="http://www.w3.org/2000/svg" width="1700" height="970" viewBox="0 0 1700 970">
<defs><marker id="route-arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L10,3 z" fill="#c2410c"/></marker></defs>
<rect width="100%" height="100%" fill="#fff7ed"/>
<text x="50" y="45" font-size="27" font-weight="bold">故宫条件性游览建议（示例）</text>
<text x="50" y="75" font-size="15" fill="#7c2d12">条件 → 建议；仅展示 12 条代表性关系，完整数据见条件建议映射表和图谱 JSON</text>
<rect x="50" y="92" width="500" height="42" rx="8" fill="#fed7aa" stroke="#c2410c"/>
<text x="70" y="118" font-size="15">下小雨且现场仍允许游览</text>
<line x1="550" y1="113" x2="700" y2="113" stroke="#c2410c" stroke-width="2" marker-end="url(#route-arrow)"/>
<rect x="710" y="92" width="900" height="42" rx="8" fill="#dcfce7" stroke="#15803d"/>
<text x="730" y="118" font-size="15">减少露天停留，按现场指引选择可进入的避雨处</text>
<rect x="50" y="162" width="500" height="42" rx="8" fill="#fed7aa" stroke="#c2410c"/>
<text x="70" y="188" font-size="15">临近结束仍有未看完的内容</text>
<line x1="550" y1="183" x2="700" y2="183" stroke="#c2410c" stroke-width="2" marker-end="url(#route-arrow)"/>
<rect x="710" y="162" width="900" height="42" rx="8" fill="#dcfce7" stroke="#15803d"/>
<text x="730" y="188" font-size="15">可以留待再次参观，不必在最后一段仓促穿行</text>
<rect x="50" y="232" width="500" height="42" rx="8" fill="#fed7aa" stroke="#c2410c"/>
<text x="70" y="258" font-size="15">仅仅想拍照</text>
<line x1="550" y1="253" x2="700" y2="253" stroke="#c2410c" stroke-width="2" marker-end="url(#route-arrow)"/>
<rect x="710" y="232" width="900" height="42" rx="8" fill="#dcfce7" stroke="#15803d"/>
<text x="730" y="258" font-size="15">可以在太和殿安排短暂停留</text>
<rect x="50" y="302" width="500" height="42" rx="8" fill="#fed7aa" stroke="#c2410c"/>
<text x="70" y="328" font-size="15">体力允许并且相关区域开放</text>
<line x1="550" y1="323" x2="700" y2="323" stroke="#c2410c" stroke-width="2" marker-end="url(#route-arrow)"/>
<rect x="710" y="302" width="900" height="42" rx="8" fill="#dcfce7" stroke="#15803d"/>
<text x="730" y="328" font-size="15">加入下午支线</text>
<rect x="50" y="372" width="500" height="42" rx="8" fill="#fed7aa" stroke="#c2410c"/>
<text x="70" y="398" font-size="15">再次到访</text>
<line x1="550" y1="393" x2="700" y2="393" stroke="#c2410c" stroke-width="2" marker-end="url(#route-arrow)"/>
<rect x="710" y="372" width="900" height="42" rx="8" fill="#dcfce7" stroke="#15803d"/>
<text x="730" y="398" font-size="15">可以提前选择一个重点，避免把全日清单当成亲子游必须完成的任务</text>
<rect x="50" y="442" width="500" height="42" rx="8" fill="#fed7aa" stroke="#c2410c"/>
<text x="70" y="468" font-size="15">出现雷雨或临时闭园</text>
<line x1="550" y1="463" x2="700" y2="463" stroke="#c2410c" stroke-width="2" marker-end="url(#route-arrow)"/>
<rect x="710" y="442" width="900" height="42" rx="8" fill="#dcfce7" stroke="#15803d"/>
<text x="730" y="468" font-size="15">停止户外行程并服从管理</text>
<rect x="50" y="512" width="500" height="42" rx="8" fill="#fed7aa" stroke="#c2410c"/>
<text x="70" y="538" font-size="15">只剩一小时</text>
<line x1="550" y1="533" x2="700" y2="533" stroke="#c2410c" stroke-width="2" marker-end="url(#route-arrow)"/>
<rect x="710" y="512" width="900" height="42" rx="8" fill="#dcfce7" stroke="#15803d"/>
<text x="730" y="538" font-size="15">删减支线，并说明无法完成全日路线</text>
<rect x="50" y="582" width="500" height="42" rx="8" fill="#fed7aa" stroke="#c2410c"/>
<text x="70" y="608" font-size="15">只有三十分钟，却希望完整参观所有展区</text>
<line x1="550" y1="603" x2="700" y2="603" stroke="#c2410c" stroke-width="2" marker-end="url(#route-arrow)"/>
<rect x="710" y="582" width="900" height="42" rx="8" fill="#dcfce7" stroke="#15803d"/>
<text x="730" y="608" font-size="15">应缩减目标或延长时间，而不是把所有停留压缩到几分钟</text>
<rect x="50" y="652" width="500" height="42" rx="8" fill="#fed7aa" stroke="#c2410c"/>
<text x="70" y="678" font-size="15">只能选择一个博物馆可以去</text>
<line x1="550" y1="673" x2="700" y2="673" stroke="#c2410c" stroke-width="2" marker-end="url(#route-arrow)"/>
<rect x="710" y="652" width="900" height="42" rx="8" fill="#dcfce7" stroke="#15803d"/>
<text x="730" y="678" font-size="15">那我一定选择故宫博物馆</text>
<rect x="50" y="722" width="500" height="42" rx="8" fill="#fed7aa" stroke="#c2410c"/>
<text x="70" y="748" font-size="15">同行者使用轮椅</text>
<line x1="550" y1="743" x2="700" y2="743" stroke="#c2410c" stroke-width="2" marker-end="url(#route-arrow)"/>
<rect x="710" y="722" width="900" height="42" rx="8" fill="#dcfce7" stroke="#15803d"/>
<text x="730" y="748" font-size="15">应先核实无障碍通道;资料没有说明时，不能直接回答“全程无台阶</text>
<rect x="50" y="792" width="500" height="42" rx="8" fill="#fed7aa" stroke="#c2410c"/>
<text x="70" y="818" font-size="15">同行者兴趣不同</text>
<line x1="550" y1="813" x2="700" y2="813" stroke="#c2410c" stroke-width="2" marker-end="url(#route-arrow)"/>
<rect x="710" y="792" width="900" height="42" rx="8" fill="#dcfce7" stroke="#15803d"/>
<text x="730" y="818" font-size="15">可预先约定参观结束后的会合地点，避免有人留在展厅、有人已经继续向北</text>
<rect x="50" y="862" width="500" height="42" rx="8" fill="#fed7aa" stroke="#c2410c"/>
<text x="70" y="888" font-size="15">同行者是情侣</text>
<line x1="550" y1="883" x2="700" y2="883" stroke="#c2410c" stroke-width="2" marker-end="url(#route-arrow)"/>
<rect x="710" y="862" width="900" height="42" rx="8" fill="#dcfce7" stroke="#15803d"/>
<text x="730" y="888" font-size="15">可在不妨碍通行的地点安排拍照</text>
</svg>